<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Exporter mon planning BadAsso</title>
    <style>
      /* Identifiers in English, user-facing text in French: the popup is read
         by French-speaking club members. */
      :root {
        color-scheme: light dark;

        --bg: #ffffff;
        --bg-soft: #f6f7f9;
        --bg-raised: #eef0f4;
        --text: #14161a;
        --text-soft: #5c636e;
        --text-faint: #868d98;
        --border: #e4e7ec;
        --border-strong: #d3d8e0;
        --accent: #932079;
        --accent-dark: #7a1a65;
        --accent-text: #ffffff;
        --error: #b3261e;
        --error-bg: #fdeceb;
        --success: #18693a;
        --success-bg: #e8f5ed;

        --radius: 10px;
        --radius-small: 7px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1d22;
          --bg-soft: #22252b;
          --bg-raised: #2a2e35;
          --text: #f1f3f5;
          --text-soft: #a7aeb9;
          --text-faint: #7e8794;
          --border: #32363d;
          --border-strong: #3f444c;
          --accent: #e48ecd;
          --accent-dark: #efa8da;
          --accent-text: #1a0714;
          --error: #f2b8b5;
          --error-bg: #3b1f1e;
          --success: #86dca8;
          --success-bg: #16301f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 344px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ------------------------------------------------------------ header */

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }

      .header svg {
        flex: none;
        width: 30px;
        height: 30px;
      }

      .header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .header p {
        margin: 1px 0 0;
        color: var(--text-soft);
        font-size: 11.5px;
      }

      /* ---------------------------------------------------------- settings */

      .settings {
        padding: 12px 16px 14px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 30px;
      }

      .row + .row {
        margin-top: 6px;
      }

      .row > label {
        color: var(--text-soft);
        font-size: 12px;
      }

      .pair {
        display: flex;
        gap: 6px;
      }

      .field {
        position: relative;
        display: flex;
        align-items: center;
      }

      .field .unit {
        position: absolute;
        right: 8px;
        color: var(--text-faint);
        font-size: 11px;
        pointer-events: none;
      }

      input[type="number"] {
        width: 74px;
        padding: 5px 26px 5px 8px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-small);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        -moz-appearance: textfield;
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      select {
        padding: 5px 8px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-small);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12px;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ------------------------------------------------------------ button */

      .actions {
        padding: 0 16px 14px;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.12s ease;
      }

      button:hover:not(:disabled) {
        background: var(--accent-dark);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button svg {
        width: 15px;
        height: 15px;
      }

      .spin {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
        button {
          transition: none;
        }
      }

      /* ------------------------------------------------------------ status */

      #status {
        margin: 0 16px 14px;
        padding: 9px 11px;
        border-radius: var(--radius-small);
        font-size: 12px;
      }

      #status:empty {
        display: none;
      }

      #status.error {
        background: var(--error-bg);
        color: var(--error);
      }

      #status.success {
        background: var(--success-bg);
        color: var(--success);
      }

      #status.pending {
        background: var(--bg-soft);
        color: var(--text-soft);
      }

      /* -------------------------------------------------------------- list */

      #list {
        max-height: 264px;
        overflow-y: auto;
        border-top: 1px solid var(--border);
        background: var(--bg-soft);
      }

      #list:empty {
        display: none;
      }

      .day {
        position: sticky;
        top: 0;
        padding: 8px 16px 4px;
        background: var(--bg-soft);
        color: var(--text-faint);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .slot {
        display: flex;
        gap: 10px;
        padding: 6px 16px 8px;
      }

      .slot .bar {
        flex: none;
        width: 3px;
        border-radius: 2px;
        background: var(--border-strong);
      }

      .slot .body {
        min-width: 0;
      }

      .slot .time {
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .slot .name {
        margin-left: 6px;
        color: var(--text);
        font-size: 12px;
      }

      .slot .place {
        margin-top: 1px;
        overflow: hidden;
        color: var(--text-soft);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <!-- Fixed colors rather than theme tokens: the header must stay
             identical to the toolbar icon, which does not invert. -->
        <rect width="100" height="100" rx="22" fill="#932079" />
        <path d="M19 13 H81 L65.5 62 H34.5 Z" fill="#ffffff" />
        <path d="M50 62 V13 M42 62 L30 13 M58 62 L70 13" stroke="#932079" stroke-width="1.7" />
        <circle cx="50" cy="66.5" r="16.5" fill="#ffffff" />
      </svg>
      <div>
        <h1>Mon planning badminton</h1>
        <p id="subtitle">Créneaux réservés au format .ics</p>
      </div>
    </header>

    <section class="settings">
      <div class="row">
        <label for="before">Période</label>
        <div class="pair">
          <span class="field">
            <input id="before" type="number" min="0" max="365" step="1" value="30" />
            <span class="unit">j&nbsp;←</span>
          </span>
          <span class="field">
            <input id="after" type="number" min="1" max="730" step="1" value="365" />
            <span class="unit">j&nbsp;→</span>
          </span>
        </div>
      </div>
      <div class="row">
        <label for="reminder">Rappel</label>
        <select id="reminder">
          <option value="0">Aucun</option>
          <option value="30">30 min avant</option>
          <option value="60">1 h avant</option>
          <option value="120">2 h avant</option>
          <option value="1440">1 jour avant</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button id="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 11 5 5 5-5" />
          <path d="M4 20h16" />
        </svg>
        <span id="button-label">Exporter mon planning</span>
      </button>
    </div>

    <div id="status" role="status"></div>
    <div id="list"></div>

    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
